name: go

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".vscode/**"
      - ".idea/**"
      - "examples/**"
      - "docker-compose.yml"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "doc/**"
      - ".vscode/**"
      - ".idea/**"
      - "examples/**"
      - "docker-compose.yml"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
          cache: true

      - name: Build
        run: cd src && go build -mod=vendor -v ./...

      - name: Test
        run: cd src && go test -mod=vendor -v ./...
